# fly.toml app configuration file generated for glive-agent on 2025-11-22T14:58:43+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'glive-agent'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  GLIVE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'glive_data'
  destination = '/app/workspace'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '1s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

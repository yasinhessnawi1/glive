version: 2

builds:
  - main: ./cmd/glive
    binary: glive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - 386
    goarm:
      - 6
      - 7
    ignore:
      # Ignore unsupported combinations
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/glive/cmd/glive/cmd.version={{.Version}}
      - -X github.com/glive/cmd/glive/cmd.commit={{.Commit}}
      - -X github.com/glive/cmd/glive/cmd.date={{.Date}}
    tags:
      - noclipboard

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github
  groups:
    - title: Features
      regexp: "^feat"
    - title: Bug Fixes
      regexp: "^fix"
    - title: Security
      regexp: "^security"

release:
  github:
    owner: yasinhessnawi1
    name: glive
  draft: false
  prerelease: auto
  name_template: "GLive {{ .Version }}"

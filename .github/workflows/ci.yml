name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Versions are pinned in one place. GO_VERSION must match the `go`/`toolchain`
# directives in go.work and every go.mod; GOLANGCI_VERSION must match
# .pre-commit-config.yaml. Bump them together or the gates disagree about what
# "clean" means (AUDIT-F-05).
env:
  GO_VERSION: '1.26.8'
  GOLANGCI_VERSION: 'v2.13.2'
  GOSEC_VERSION: 'v2.22.9'
  GOVULNCHECK_VERSION: 'v1.1.4'

# NOTE ON MODULE ENUMERATION (AUDIT-F-22).
# This workflow never hand-maintains a list of modules. Four such lists existed
# and all four omitted pkg/testing, so that module was never linted, tested or
# scanned. Every loop now iterates `go list -m -f '{{.Dir}}'`, so a module added
# to go.work is picked up by every gate automatically.
#
# Why not the simpler `./...` from the repo root: this repo has a vestigial root
# go.mod (`module github.com/glive`, no Go files) that is NOT in go.work, so the
# root directory belongs to no workspace module and `go test ./...` there fails
# with "directory prefix . does not contain modules listed in go.work". Removing
# that stub would make root-level `./...` work and is worth doing, but it is a
# separate change from this one. An explicit path still resolves, which is why
# the build job below can say `go build ./cmd/glive`.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Verify pinned version
        run: golangci-lint --version
        shell: bash
      - name: Lint every workspace module
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            echo "::group::Linting ${dir}"
            (cd "$dir" && golangci-lint run ./...) || status=1
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')
          exit "$status"
        shell: bash

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # CI is the authority for -race: the Windows dev machine only gained a C
      # toolchain recently (AUDIT-F-21).
      - name: Test every workspace module
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            echo "::group::Testing ${dir}"
            (cd "$dir" && go test -race -covermode=atomic -coverprofile=coverage.out ./...) || status=1
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')
          exit "$status"
        shell: bash
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job previously had no setup-go step at all and ran against whatever
      # Go the runner image happened to ship.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      # Both tools were installed with @latest, which makes the tools that guard
      # the supply chain part of it (standards section 5).
      - name: Install pinned scanners
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
        shell: bash
      - name: gosec (every workspace module)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            echo "::group::gosec ${dir}"
            (cd "$dir" && gosec ./...) || status=1
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')
          exit "$status"
        shell: bash
      - name: govulncheck (every workspace module)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            echo "::group::govulncheck ${dir}"
            (cd "$dir" && govulncheck ./...) || status=1
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')
          exit "$status"
        shell: bash

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./cmd/glive

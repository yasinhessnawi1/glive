name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Versions are pinned in one place. GO_VERSION must match the `go`/`toolchain`
# directives in go.work and every go.mod; GOLANGCI_VERSION must match
# .pre-commit-config.yaml. Bump them together or the gates disagree about what
# "clean" means (AUDIT-F-05).
env:
  GO_VERSION: '1.26.8'
  GOLANGCI_VERSION: 'v2.13.2'
  GOVULNCHECK_VERSION: 'v1.1.4'
  # gosec is not pinned here: it runs inside golangci-lint (see the security job),
  # so its version is golangci-lint's. The task-level `gosec ./...` gate that
  # security-touching work runs by hand should use v2.22.9, the version the GL0
  # T0a/T0b gates were measured with.

# NOTE ON MODULE ENUMERATION (AUDIT-F-22).
# This workflow never hand-maintains a list of modules. Four such lists existed
# and all four omitted pkg/testing, so that module was never linted, tested or
# scanned. Every loop now iterates `go list -m -f '{{.Dir}}'`, so a module added
# to go.work is picked up by every gate automatically.
#
# Why not the simpler `./...` from the repo root: it does not work here, and not
# for the reason first assumed. A vestigial root go.mod was suspected and has
# since been deleted - but `go list ./...` at the root STILL fails with
# "directory prefix . does not contain modules listed in go.work". In workspace
# mode the pattern is resolved against the current directory, and the repo root
# is not itself a module directory: every module lives one or two levels down
# (cmd/glive, pkg/*, tests). Containing the modules is not the same as being one.
# An explicit path does resolve, which is why the build job below can say
# `go build ./cmd/glive`. The generated loop is therefore not a workaround for
# the stub - it is the only form that covers every module.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Verify pinned version
        run: golangci-lint --version
        shell: bash
      - name: Lint every workspace module
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            echo "::group::Linting ${dir}"
            (cd "$dir" && golangci-lint run ./...) || status=1
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')
          exit "$status"
        shell: bash

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # CI is the authority for -race: the Windows dev machine only gained a C
      # toolchain recently (AUDIT-F-21).
      - name: Test every workspace module
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            echo "::group::Testing ${dir}"
            (cd "$dir" && go test -race -covermode=atomic -coverprofile=coverage.out ./...) || status=1
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')
          exit "$status"
        shell: bash
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job previously had no setup-go step at all and ran against whatever
      # Go the runner image happened to ship.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      # govulncheck was installed with @latest, which makes a tool that guards the
      # supply chain part of it (standards section 5).
      - name: Install pinned scanner
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
        shell: bash
      # gosec is NOT run standalone here. It is enabled inside golangci-lint (see
      # .golangci.yml `linters.enable`), so it runs on every module in the lint
      # job above, under the same config and the same new-from-rev baseline.
      #
      # Running the gosec binary here as well would apply a SECOND, unbaselined
      # definition of "clean": it exits 1 on any finding, and it does so today on
      # seven of the nine modules. That is the same three-versions-of-clean drift
      # this workflow exists to remove (AUDIT-F-05), just with gosec instead of
      # golangci-lint. One tool, one config, one baseline.
      #
      # The task-level `gosec ./...` gate for security-touching work (GL0 T9/T12/
      # T14/T15) is a separate, manual reviewer step - it is meant to surface the
      # full finding list for triage, which is exactly what a CI gate must not do.
      - name: govulncheck (every workspace module)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r dir; do
            echo "::group::govulncheck ${dir}"
            (cd "$dir" && govulncheck ./...) || status=1
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')
          exit "$status"
        shell: bash

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./cmd/glive

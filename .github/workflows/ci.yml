name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          install-mode: "binary"
      - name: Run lint in workspace modules
        run: |
          for dir in cmd/glive pkg/agent pkg/core pkg/domain pkg/infrastructure pkg/interface pkg/usecase tests; do
            echo "Linting $dir"
            cd $dir
            golangci-lint run
            cd -
          done
        shell: bash

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run tests in workspace modules
        run: |
          for dir in cmd/glive pkg/agent pkg/core pkg/domain pkg/infrastructure pkg/interface pkg/usecase tests; do
            echo "Testing $dir"
            cd $dir
            go test -race -coverprofile=coverage.out ./...
            cd -
          done
        shell: bash
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: ./...
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for dir in cmd/glive pkg/agent pkg/core pkg/domain pkg/infrastructure pkg/interface pkg/usecase tests; do
            echo "Checking $dir"
            cd $dir
            govulncheck ./...
            cd -
          done
        shell: bash

  build:
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./cmd/glive
